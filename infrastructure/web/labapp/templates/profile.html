{% extends "base.html" %}
{% block content %}
<h2>User Profile</h2>
{% if profile %}
<table>
  <tr><th>ID</th><td>{{ profile.id }}</td></tr>
  <tr><th>Username</th><td>{{ profile.username }}</td></tr>
  <tr><th>Role</th><td>{{ profile.role }}</td></tr>
  <tr><th>Email</th><td>{{ profile.email }}</td></tr>
  <tr><th>Department</th><td>{{ profile.department }}</td></tr>
</table>
{% else %}
<p>No profile found.</p>
{% endif %}
{% endblock %}
