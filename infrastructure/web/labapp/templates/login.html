{% extends "base.html" %}
{% block content %}
<h2>Login</h2>
<p>Local training accounts use deterministic fake credentials listed in the project README.</p>
{% if error %}<p class="warning">{{ error }}</p>{% endif %}
<form method="post">
  <label>Username<br><input name="username" autocomplete="off"></label><br>
  <label>Password<br><input name="password" type="password"></label><br>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
