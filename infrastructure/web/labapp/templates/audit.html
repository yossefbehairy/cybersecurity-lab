{% extends "base.html" %}
{% block content %}
<h2>Audit Records</h2>
<table>
  <tr><th>ID</th><th>Actor</th><th>Action</th><th>Target</th><th>Created</th></tr>
  {% for row in rows %}
  <tr><td>{{ row.id }}</td><td>{{ row.actor }}</td><td>{{ row.action }}</td><td>{{ row.target }}</td><td>{{ row.created_at }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
