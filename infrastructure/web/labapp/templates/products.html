{% extends "base.html" %}
{% block content %}
<h2>Product Search</h2>
<form method="get">
  <input name="q" value="{{ q }}" placeholder="Search product names">
  <button type="submit">Search</button>
</form>
{% if db_error %}<p class="warning">{{ db_error }}</p>{% endif %}
<table>
  <tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th></tr>
  {% for row in rows %}
  <tr><td>{{ row.id }}</td><td>{{ row.name }}</td><td>{{ row.category }}</td><td>{{ row.price }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
